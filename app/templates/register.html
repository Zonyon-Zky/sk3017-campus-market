{% extends "base.html" %}{% block title %}注册 · 校园拾光集{% endblock %}{% block body_class %}auth-body{% endblock %}
{% block body %}<div class="auth-layout"><section class="auth-art register-art"><a class="brand light" href="{{ url_for('market.index') }}"><span class="brand-mark">拾</span><span>校园拾光集<small>CAMPUS LOOP MARKET</small></span></a><div class="auth-copy"><span class="eyebrow light">JOIN THE LOOP</span><h1>把不需要的，<br>交给刚刚需要的人。</h1><p>发布商品、收藏心仪好物、在详情页留言沟通，全部在校园内完成。</p></div><div class="register-points"><span>教材</span><span>数码</span><span>生活</span><span>运动</span></div></section><section class="auth-panel"><div class="auth-box"><span class="eyebrow">CREATE ACCOUNT</span><h2>注册校园集市</h2><p>几步即可发布你的第一件闲置。</p><form method="post" class="auth-form"><label>用户名<input name="username" minlength="3" maxlength="20" placeholder="3-20位字符" required></label><label>昵称<input name="nickname" maxlength="30" placeholder="你的校园昵称" required></label><label>密码<input name="password" type="password" minlength="6" placeholder="至少6位" required></label><button class="btn primary full" type="submit">创建账号</button></form><p class="switch">已有账号？<a href="{{ url_for('auth.login') }}">直接登录</a></p></div></section></div>{% endblock %}
