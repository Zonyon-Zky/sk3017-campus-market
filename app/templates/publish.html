{% extends "base.html" %}{% block title %}发布闲置 · 校园拾光集{% endblock %}
{% block body %}
<div class="shell page-space"><div class="page-heading"><span class="eyebrow">LIST AN ITEM</span><h1>发布一件闲置</h1><p>认真描述它，让下一位主人更快找到。</p></div>{% if error %}<div class="form-error">{{ error }}</div>{% endif %}<form class="publish-layout" method="post" enctype="multipart/form-data"><section class="form-panel"><h2>商品信息</h2><label>标题<input name="title" maxlength="100" value="{{ form.get('title','') }}" placeholder="例如：九成新机械键盘" required></label><label>分类<select name="category_id" required><option value="">请选择分类</option>{% for c in categories %}<option value="{{ c.id }}" {{ 'selected' if form.get('category_id')|string == c.id|string else '' }}>{{ c.name }}</option>{% endfor %}</select></label><label>价格<input name="price" type="number" min="0.01" step="0.01" value="{{ form.get('price','') }}" placeholder="0.00" required></label><label>描述<textarea name="description" maxlength="1000" rows="6" placeholder="成色、使用情况、配件、面交方式…" required>{{ form.get('description','') }}</textarea></label></section><aside class="upload-panel"><h2>商品图片</h2><label class="drop-zone"><input name="images" type="file" accept="image/png,image/jpeg" multiple required><span>＋</span><b>选择 1-3 张图片</b><small>JPG / PNG，单张不超过 2MB</small></label><div class="upload-preview" id="uploadPreview"></div><button class="btn primary full" type="submit">发布商品</button><p class="form-note">图片会自动重命名，避免文件名冲突。</p></aside></form></div>
{% endblock %}
